version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: bryshop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: BryshopDB
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust  # Pas de mot de passe requis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bryshop_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BryshopDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Django
  web:
    image: ${DOCKER_IMAGE:-cdjiatou/bryshop:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bryshop_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 ECOMMERCE.wsgi:application"
    environment:
      - DEBUG=False
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=BryshopDB
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - static_volume:/app/staticfiles
      - django_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bryshop_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # OBSERVABILITE (Stack ELK)
  # ============================================
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - bryshop_network

  logstash:
    image: logstash:8.10.2
    container_name: logstash
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - django_logs:/var/log/django:ro
    depends_on:
      - elasticsearch
    networks:
      - bryshop_network

  kibana:
    image: kibana:8.10.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - bryshop_network

  # ============================================
  # SUPERVISION (Prometheus & Grafana)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - bryshop_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - bryshop_network

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  django_logs:
    driver: local
  elasticsearch_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  bryshop_network:
    driver: bridge
