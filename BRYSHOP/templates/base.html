<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BryShop E-commerce{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="{% url 'Accueil' %}">BryShop</a>
                {% if user.is_authenticated %}
                    <a class="btn btn-sm btn-outline-secondary" href="{% url 'profile' %}">Mon Profil</a>
                    <a class="btn btn-sm btn-danger ms-2" href="{% url 'logout' %}">Déconnexion</a>
                {% else %}
                    <a class="btn btn-sm btn-primary" href="{% url 'login' %}">Connexion</a>
                {% endif %}
            </div>
        </nav>
    </header>
    
    <main>
        {% block content %}
            {% endblock %}
    </main>

    <footer>
        <div class="container text-center py-3">
            <p>&copy; 2025 BryShop. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
