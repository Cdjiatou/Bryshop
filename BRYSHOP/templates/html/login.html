{% extends "html/menu.html" %}
{% block content %}
<div class="container py-5">
    <h2>Connexion</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-success">Se connecter</button>
    </form>
    <p class="mt-3">Pas encore de compte ? <a href="{% url 'register' %}">Créer un compte</a></p>
</div>
{% endblock %}
