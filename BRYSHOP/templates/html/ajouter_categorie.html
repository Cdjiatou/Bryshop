{% extends 'html/index.html' %}
{% load static %}
{% block content %}
<div class="container mt-4">
    <h3>Ajouter une catégorie</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Ajouter</button>
        <a href="/dashboard/" class="btn btn-secondary">Retour</a>
    </form>
</div>
{% endblock %}
