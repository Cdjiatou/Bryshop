# ============================================
# Configuration SonarQube pour BryShop
# ============================================

# Informations du projet
sonar.projectKey=bryshop
sonar.projectName=BryShop E-Commerce
sonar.projectVersion=1.0

# Chemins source
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/migrations/**,\
                 **/tests/**,\
                 **/test_*.py,\
                 **/static/**,\
                 **/media/**,\
                 **/venv/**,\
                 **/env/**,\
                 **/__pycache__/**,\
                 **/node_modules/**,\
                 **/*.pyc

# Tests
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py

# Couverture de code
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/migrations/**,\
                          **/tests/**,\
                          **/test_*.py,\
                          **/manage.py,\
                          **/wsgi.py,\
                          **/asgi.py,\
                          **/settings.py

# Version Python
sonar.python.version=3.11

# Quality Gate
# Le pipeline échouera si :
# - La couverture de code est < 80%
# - Des vulnérabilités de niveau High sont détectées
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
