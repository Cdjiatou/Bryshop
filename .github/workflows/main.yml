name: BryShop CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bryshop
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # STAGE 1: Lint & Test
  # ============================================
  lint-and-test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: BryshopDB
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymysql cryptography
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pylint coverage

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run tests & Generate coverage
        env:
          DATABASE_NAME: BryshopDB
          DATABASE_USER: postgres
          DATABASE_PASSWORD: ''
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: |
          coverage run --source='.' manage.py test --verbosity=2
          coverage report
          coverage xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        if: always()

  # ============================================
  # STAGE 2: Code Quality (SonarQube)
  # ============================================
  code-quality:
    name: 📊 Code Quality Analysis
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
        continue-on-error: true

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=bryshop
            -Dsonar.sources=.
            -Dsonar.exclusions=**/migrations/**,**/tests/**,**/static/**,**/media/**,**/venv/**
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.11

      - name: Wait for Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ============================================
  # STAGE 3: Build, Scan & Push Docker Hub
  # ============================================
  build-scan-push:
    name: 🐳 Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    outputs:
      image-digest: ${{ steps.docker_push.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Local Load)
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Run Trivy vulnerability scanner (Blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push Docker image
        id: docker_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Image digest
        run: |
          echo "Image pushed successfully!"
          echo "Digest: ${{ steps.docker_push.outputs.digest }}"

  # ============================================
  # STAGE 4: Deploy to O2Switch
  # ============================================
  deploy:
    name: 🚀 Deploy to O2Switch
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.O2SWITCH_SSH_KEY }}

      - name: Deploy to O2Switch
        env:
          O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
          O2SWITCH_USER: ${{ secrets.O2SWITCH_USER }}
          O2SWITCH_PATH: ${{ secrets.O2SWITCH_PATH }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Passage propre des variables d'environnement au script SSH distant
          ssh -o StrictHostKeyChecking=no $O2SWITCH_USER@$O2SWITCH_HOST "DOCKER_IMAGE='$DOCKER_IMAGE' COMMIT_SHA='$COMMIT_SHA' O2SWITCH_PATH='$O2SWITCH_PATH'" 'bash -s' << 'EOF'
            set -e
            cd "$O2SWITCH_PATH"
            docker pull "$DOCKER_IMAGE:$COMMIT_SHA"
            docker tag "$DOCKER_IMAGE:$COMMIT_SHA" "$DOCKER_IMAGE:latest"
            docker-compose down || true
            export DOCKER_IMAGE
            docker-compose up -d
            sleep 10
            if docker ps | grep -q bryshop_web; then
              echo "Deployment successful!"
            else
              echo "Deployment failed!"
              exit 1
            fi
          EOF